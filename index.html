<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fbeac1" />
  <title>AIRPORTELS · Cafe Run</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="canvas-bg"></div>
  <div class="canvas">
    <div class="phone" id="phone">

      <a class="admin-link" href="admin.html">Admin →</a>

      <!-- ─────────── LOGIN ─────────── -->
      <section class="screen active" id="screen-login">
        <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch language">
          <span class="lang-pill" data-lang="en">EN</span><span class="lang-sep">/</span><span class="lang-pill" data-lang="th">TH</span>
        </button>
        <div class="login-hero">
          <div class="brand-row brand-row--logos">
            <img class="brand-logo" src="assets/airportels-logo.jpg" alt="AIRPORTELS" />
            <span class="brand-sep" aria-hidden="true">|</span>
            <img class="brand-logo brand-logo--cafe" src="assets/cafe-gather-logo.jpeg" alt="Cafe Gather" />
          </div>
          <h1 class="login-title" data-i18n-html="login.title"></h1>
          <p class="login-blurb" data-i18n="login.blurb"></p>
        </div>

        <form class="login-card" id="login-form" autocomplete="off">
          <div class="field">
            <label for="name" data-i18n="login.name.label"></label>
            <input id="name" name="name" type="text" data-i18n-placeholder="login.name.placeholder" required maxlength="40" autocomplete="given-name" />
          </div>
          <div class="field">
            <label for="room" data-i18n="login.room.label"></label>
            <select id="room" name="room" required></select>
          </div>
          <button type="submit" class="btn-primary" id="login-submit">
            <span data-i18n="login.submit"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
          </button>
        </form>

        <p class="login-foot" data-i18n="login.foot"></p>
      </section>

      <!-- ─────────── MENU ─────────── -->
      <section class="screen" id="screen-menu">
        <header class="app-header">
          <div class="app-header-brand" aria-hidden="true">
            <img class="brand-logo brand-logo--sm" src="assets/airportels-logo.jpg" alt="" />
            <span class="brand-sep brand-sep--sm">|</span>
            <img class="brand-logo brand-logo--sm brand-logo--cafe" src="assets/cafe-gather-logo.jpeg" alt="" />
          </div>
          <div>
            <div class="title" data-i18n="menu.title"></div>
            <div class="sub" id="menu-clock">—</div>
          </div>
          <div class="spacer"></div>
          <button class="icon-btn" id="lang-toggle-menu" aria-label="Switch language" title="EN / TH">
            <span class="lang-pill" data-lang="en">EN</span><span class="lang-sep">/</span><span class="lang-pill" data-lang="th">TH</span>
          </button>
          <button class="icon-btn" id="signout-btn" aria-label="Sign out" title="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
          </button>
        </header>

        <div class="menu-greet">
          <div class="hello" id="hello-name">Hi.</div>
          <div class="room" id="hello-room"></div>
        </div>

        <nav class="cat-tabs" id="cat-tabs"></nav>
        <div class="drink-list" id="drink-list"></div>

        <div class="cart-bar hidden" id="cart-bar">
          <div class="cart-count" id="cart-count">0</div>
          <div class="cart-label" data-i18n="cart.review"></div>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </section>

      <!-- ─────────── CONFIRM ─────────── -->
      <section class="screen" id="screen-confirm">
        <div class="confirm-inner">
          <div class="confirm-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4 4 10-10"/></svg>
          </div>
          <h1 class="confirm-title" data-i18n="confirm.title"></h1>
          <p class="confirm-body" id="confirm-body"></p>

          <div class="order-code-card">
            <div class="label" data-i18n="confirm.code"></div>
            <div class="code" id="order-code">····</div>
          </div>

          <div class="order-summary" id="order-summary"></div>

          <div class="confirm-actions">
            <button class="btn-primary" id="back-to-menu" data-i18n="confirm.back"></button>
            <a class="btn-secondary" href="admin.html" data-i18n="confirm.seeall" style="text-decoration: none; display: grid; place-items: center;"></a>
          </div>
        </div>
      </section>

      <!-- ─────────── BOTTOM SHEETS ─────────── -->
      <div class="sheet-veil" id="veil"></div>

      <!-- customize sheet -->
      <aside class="sheet" id="sheet-customize" aria-hidden="true">
        <div class="sheet-grip"></div>
        <button class="sheet-close" id="cust-close" aria-label="Cancel and close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="sheet-head">
          <div class="sheet-title" id="cust-name">—</div>
          <div class="sheet-sub" id="cust-desc">—</div>
        </div>
        <div class="sheet-body" id="cust-body"></div>
        <div class="sheet-foot">
          <button class="btn-primary" id="cust-add" data-i18n="sheet.cust.add"></button>
        </div>
      </aside>

      <!-- cart sheet -->
      <aside class="sheet" id="sheet-cart" aria-hidden="true">
        <div class="sheet-grip"></div>
        <div class="sheet-head">
          <div class="sheet-title" data-i18n="sheet.cart.title"></div>
          <div class="sheet-sub" id="cart-sub" data-i18n="sheet.cart.sub"></div>
        </div>
        <div class="sheet-body">
          <div class="cart-list" id="cart-list"></div>
          <div class="field" style="margin-top: 16px;">
            <label for="order-note" data-i18n="sheet.cart.note.label"></label>
            <textarea id="order-note" class="note-input" data-i18n-placeholder="sheet.cart.note.placeholder" maxlength="160"></textarea>
          </div>
          <div class="totals">
            <div class="row grand"><span data-i18n="sheet.cart.items"></span><span id="cart-items-count">0</span></div>
          </div>
        </div>
        <div class="sheet-foot">
          <button class="btn-secondary" id="cart-close" data-i18n="sheet.cart.back" style="width: 110px;"></button>
          <button class="btn-primary" id="cart-send" data-i18n="sheet.cart.send"></button>
        </div>
      </aside>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="menu.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
